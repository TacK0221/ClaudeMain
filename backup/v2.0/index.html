<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11563d">
<meta name="robots" content="noindex">
<title>麻雀スコア帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column, sticky header, fixed bottom tab bar like a score app on the table edge */
:root{
  --bg:#eaefeb; --surface:#fbfcfa; --sunk:#dfe6e1; --ink:#14221c; --muted:#5a6a62; --line:#cdd7d0;
  --felt:#11563d; --felt-ink:#f4f8f5; --tile:#f6f1e2; --tile-ink:#9b1d1d; --tile-text:#1d2a24;
  --pos:#0f6a49; --neg:#b4302a; --warn:#9a6a00;
  /* 順位の色（1位 緑・2位 青・3位 橙・最下位 赤）。隣どうしが色覚の違いがあっても見分けられることを検証済み */
  --r1:#0f8a4f; --r2:#2a78d6; --r3:#e08e00; --r4:#c9364f; --rk-ink:#ffffff; --rk3-ink:#14221c;
  /* グラフの系列色（メンバーごとに固定。U001から順に割り当て、9人目以降は灰色） */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s-other:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#15201b; --sunk:#0f1915; --ink:#e4ebe6; --muted:#90a198; --line:#283630;
  --felt:#3a9d74; --felt-ink:#06120d; --tile:#e9e2cd; --tile-ink:#9b1d1d;
  --pos:#55c493; --neg:#ff7a6e; --warn:#e2b54a;
  --r1:#2fae6e; --r2:#3987e5; --r3:#c98500; --r4:#d9475f; --rk-ink:#06120d; --rk3-ink:#06120d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#898781; --grid:#26332d; --axis:#3a4842; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#15201b; --sunk:#0f1915; --ink:#e4ebe6; --muted:#90a198; --line:#283630;
  --felt:#3a9d74; --felt-ink:#06120d; --tile:#e9e2cd; --tile-ink:#9b1d1d;
  --pos:#55c493; --neg:#ff7a6e; --warn:#e2b54a;
  --r1:#2fae6e; --r2:#3987e5; --r3:#c98500; --r4:#d9475f; --rk-ink:#06120d; --rk3-ink:#06120d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#898781; --grid:#26332d; --axis:#3a4842; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:8px calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--felt);color:var(--felt-ink)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.tile{display:inline-grid;place-items:center;width:28px;height:36px;border-radius:5px;background:var(--tile);color:var(--tile-ink);font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em}
.status{margin-left:auto;font-size:12px;opacity:.85}
h2{font-family:var(--display);font-size:20px;margin:18px 0 10px;text-wrap:balance}
h3{font-size:15px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=tel],select{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px;font-size:16px;width:100%;min-width:0}
/* iOS Safari は日付欄を中身の幅で広げてはみ出させるので、見た目を素の入力欄に揃えて幅を親に合わせる */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--felt);color:var(--felt-ink);border-color:var(--felt);font-weight:700}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.banner{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--sunk);border:1px solid var(--line)}
.banner.warn{border-color:var(--warn);color:var(--warn)}

/* score entry */
.seat-grid{display:flex;flex-direction:column;gap:8px}
/* 1人分 = 縦長の牌（家）＋ 上段:メンバー / 下段:素点 ＋ 右端:結果。狭いスマホでも名前と素点を全幅で表示する */
.seat{display:grid;grid-template-columns:40px minmax(0,1fr) 54px;grid-template-areas:"w p p" "w s r";gap:6px 8px;align-items:center}
.seat .wind{grid-area:w;align-self:stretch;width:40px;height:auto}
.seat select{grid-area:p}
.seat .score-box{grid-area:s}
.seat .res{grid-area:r}
.seat-grid{gap:14px}
.wind{display:grid;place-items:center;width:34px;height:42px;border-radius:5px;background:var(--tile);color:var(--tile-text);font-family:var(--display);font-weight:800;font-size:19px;box-shadow:0 2px 0 var(--line)}
.score-box{display:flex;min-width:0}
.score-box input{text-align:right}
/* 点数欄は type=number（iPhone・Android ともにマイナスを打てるキーボードが出る）。PCで出る上下の矢印は消す */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.res{text-align:right;line-height:1.2}
.res b{display:block;font-size:15px}
.res span{font-size:11.5px;color:var(--muted)}
.sumline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}

/* rank chips */
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;color:var(--rk-ink);flex:none}
.rk1{background:var(--r1)} .rk2{background:var(--r2)} .rk3{background:var(--r3);color:var(--rk3-ink)} .rk4{background:var(--r4)}

/* history */
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.day>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:baseline;gap:10px}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .d{font-family:var(--display);font-weight:800;font-size:17px}
details.day>summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
details.day[open]>summary .chev{transform:rotate(90deg)}
.day-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td.nm{overflow-wrap:anywhere}
.c-rk{width:30px}.c-raw{width:66px}.c-pt{width:50px}.c-n{width:40px}.c-avg{width:62px}.c-tot{width:58px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.r,th.r{text-align:right}
.game{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.game-head{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.game-head .acts{margin-left:auto;display:flex;gap:6px}
.game td{border-bottom:0;padding:3px 4px}

/* stats */
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* 4麻/3麻の切り替えは、期間の切り替えと区別できるよう選択中を緑で示す */
.mode-seg button[aria-pressed=true]{background:var(--felt);color:var(--felt-ink)}
.mode-seg button[disabled]{cursor:not-allowed;opacity:.5}
.pcard{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.pcard .pos-no{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.pcard .name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.pcard .total{font-size:22px;font-weight:700;text-align:right}
.pcard .meta{grid-column:2 / 4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;font-size:12px}
.pcard .meta div b{display:block;font-size:14px;color:var(--ink)}
.pcard .meta div{color:var(--muted)}
.dist{grid-column:2 / 4;display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.dist i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* 記録帳: 横に長い表なので枠の中で横スクロール。回数の列は左に固定 */
.sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;max-width:100%}
table.sheet{table-layout:auto;width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.sheet th,.sheet td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
.sheet tr>*:last-child{border-right:0}
.sheet tfoot td,.sheet tfoot th{border-bottom:0}
.sheet .rn{position:sticky;left:0;z-index:2;background:var(--sunk);width:32px;min-width:32px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:500}
.sheet thead th{background:var(--sunk);padding:4px}
.sheet thead .colh{display:flex;flex-direction:column;align-items:center}
.sheet thead select{width:82px;padding:7px 2px;font-size:16px}
.sheet .delcol{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;width:100%;height:20px;padding:0;line-height:20px}
.sheet td input{display:block;border:0;border-radius:0;width:76px;text-align:right;padding:10px 8px;background:transparent;font-size:16px}
.sheet td input:focus-visible{outline:2px solid var(--felt);outline-offset:-2px}
.sheet td input.neg{color:var(--neg)}
.sheet .st{width:64px;min-width:64px;font-size:12px;text-align:center;padding:0 4px;white-space:nowrap}
.sheet .st.ok{color:var(--pos);font-weight:700}
.sheet .st.ng{color:var(--warn);font-weight:700}
.sheet tfoot td{background:var(--sunk);font-weight:700;text-align:right;padding:9px 8px}
.sheet tfoot .rn{font-weight:700}

/* 累積グラフ */
.chart-box{position:relative}
#chart{display:block;width:100%;height:240px;touch-action:pan-y}
#chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.tip{position:absolute;top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;min-width:120px;max-width:190px;z-index:3}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:inline-flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-block;width:10px;height:3px;border-radius:2px;flex:none}
.legend-chips{display:flex;flex-wrap:wrap;gap:6px}
.legend-chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;max-width:100%}
.legend-chips button span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-chips button[aria-pressed=false]{opacity:.45}
.legend-chips button[aria-pressed=false] .sw{background:var(--muted)!important}

/* members */
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.uid{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:5px;padding:3px 6px}
.uma-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:transparent;padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.tabbar button .g{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
.tabbar button[aria-current=page]{color:var(--felt)}
.tabbar button[aria-current=page] .g{color:var(--felt)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (max-width:400px){.two{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in"><span class="tile" aria-hidden="true">中</span><span class="brand">麻雀スコア帳</span><span id="status" class="status">接続中…</span></div></header>

<div class="wrap">
  <div id="global-banner" class="banner warn" hidden style="margin-top:12px"></div>

  <!-- 入力 -->
  <section id="tab-input" class="tab">
    <h2 id="input-title">半荘の結果を入力</h2>
    <form id="game-form" class="card stack" autocomplete="off">
      <div class="seg mode-seg" data-mode-for="input" role="group" aria-label="人数"><button type="button" data-m="4">4人麻雀</button><button type="button" data-m="3">3人麻雀</button></div>
      <div class="row" style="flex-wrap:nowrap">
        <label class="f" style="flex:1">対局日<input type="date" id="g-date" required></label>
      </div>
      <div class="seat-grid" id="seats"></div>
      <div class="sumline num"><span id="sum-text">合計 0 / 100,000</span><button type="button" class="btn sm" id="fill-rest">残りを自動入力</button></div>
      <div id="form-msg" class="banner warn" hidden></div>
      <button type="submit" class="btn primary big" id="save-game">この半荘を保存</button>
      <button type="button" class="btn ghost" id="cancel-edit" hidden>編集をやめる</button>
      <p class="small muted" id="rule-summary" style="margin:0"></p>
    </form>
    <h2>今日の成績</h2>
    <div id="today-box"></div>
  </section>

  <!-- 記録帳（まとめて入力） -->
  <section id="tab-sheet" class="tab" hidden>
    <h2 id="sheet-title">記録帳でまとめて入力</h2>
    <div class="card stack">
      <div class="seg mode-seg" data-mode-for="sheet" role="group" aria-label="人数"><button type="button" data-m="4">4人麻雀</button><button type="button" data-m="3">3人麻雀</button></div>
      <label class="f">対局日<input type="date" id="b-date"></label>
      <p class="small muted" style="margin:0" id="sheet-help"></p>
      <div class="row" id="b-tools">
        <button type="button" class="btn sm" id="b-addrow">行を追加</button>
        <button type="button" class="btn sm" id="b-addcol">列を追加</button>
        <button type="button" class="btn sm" id="b-clear">スコアを消す</button>
      </div>
      <div class="sheet-wrap"><table class="sheet num" id="sheet"></table></div>
      <div id="b-msg" class="banner warn" hidden></div>
      <button type="button" class="btn primary big" id="b-save">まとめて保存</button>
      <button type="button" class="btn ghost" id="b-cancel" hidden>編集をやめる</button>
    </div>
  </section>

  <!-- 履歴 -->
  <section id="tab-history" class="tab" hidden>
    <h2>日付別の履歴</h2>
    <div class="seg mode-seg" data-mode-for="view" role="group" aria-label="表示する麻雀の種類" style="margin-bottom:10px"><button type="button" data-m="4">4人麻雀</button><button type="button" data-m="3">3人麻雀</button></div>
    <div class="row" style="margin-bottom:10px"><label class="f" style="flex:1">月で絞り込み<select id="h-month"></select></label></div>
    <div id="history" class="stack"></div>
  </section>

  <!-- 成績 -->
  <section id="tab-stats" class="tab" hidden>
    <h2>累計成績</h2>
    <div class="stack">
      <div class="seg mode-seg" data-mode-for="view" role="group" aria-label="表示する麻雀の種類"><button type="button" data-m="4">4人麻雀</button><button type="button" data-m="3">3人麻雀</button></div>
      <div class="seg" id="period" role="group" aria-label="集計期間">
        <button type="button" data-p="all" aria-pressed="true">全期間</button>
        <button type="button" data-p="year" aria-pressed="false">今年</button>
        <button type="button" data-p="month" aria-pressed="false">今月</button>
        <button type="button" data-p="custom" aria-pressed="false">期間指定</button>
      </div>
      <div class="two" id="custom-range" hidden>
        <label class="f">開始日<input type="date" id="s-from"></label>
        <label class="f">終了日<input type="date" id="s-to"></label>
      </div>
      <div class="legend" id="rank-legend"></div>
      <div id="stats" class="stack"></div>
      <div id="trend" class="card stack" hidden>
        <h3>累積スコアの推移</h3>
        <div class="chart-box" id="chart-box"><svg id="chart" role="img" aria-label="メンバーごとの累積スコアの推移"></svg><div class="tip" id="chart-tip" hidden></div></div>
        <div class="legend-chips" id="chart-legend"></div>
        <p class="small muted" style="margin:0">グラフをタップするとその日の累積スコアが出ます。名前を押すと線の表示・非表示を切り替えられます。</p>
      </div>
    </div>
  </section>

  <!-- メンバー -->
  <section id="tab-members" class="tab" hidden>
    <h2>メンバー</h2>
    <form id="member-form" class="card row" autocomplete="off" style="flex-wrap:nowrap">
      <input type="text" id="m-name" placeholder="ユーザー名を入力" maxlength="20" aria-label="追加するユーザー名">
      <button class="btn primary" type="submit">追加</button>
    </form>
    <div class="card" style="margin-top:12px" id="members"></div>

<script>
(function(){
/* ルール（固定）。どちらも五捨六入・同点は上家優先・1位は残りの合計で調整
   4麻: 25,000点持ち 30,000点返し（オカ+20）、ウマ 10,000点単位で 2,1,-1,-2
   3麻: 35,000点持ち 40,000点返し（オカ+15）、ウマ 10,000点単位で 1,0,-1 */
const RULESETS={
  4:{n:4,start:25000,ret:30000,uma:[20,10,-10,-20],text:'25,000点持ち 30,000点返し（オカ+20）・ウマ +20 / +10 / −10 / −20・五捨六入・同点は上家優先'},
  3:{n:3,start:35000,ret:40000,uma:[10,0,-10],text:'35,000点持ち 40,000点返し（オカ+15）・ウマ +10 / 0 / −10・五捨六入・同点は上家優先'}};
const SEATS=['東','南','西','北'];
/* inputMode: 入力画面の人数、viewMode: 履歴・成績で表示する種類（どちらもこの端末に覚えておく） */
let inputMode=null, viewMode=null;
const $=s=>document.querySelector(s);
/* db: Firestore。base は接続できたら db が入る（未接続なら null） */
let db=null, base=null, canWrite=true, members=[], games=[];
const col=name=>base.collection(name);
let editing=null, period='all';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const asMode=v=>v===3?3:4;
inputMode=asMode(store.get('mj.inputMode'));viewMode=asMode(store.get('mj.viewMode'));
/* 順位バッジの色: 最下位はいつも赤（3麻の3位 = 4麻の4位と同じ色） */
const rkClass=(rank,n)=>'rk'+(rank===n?4:rank);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtPt(p){if(p==null||isNaN(p))return '—';const a=Math.abs(p),s=Number.isInteger(a)?String(a):a.toFixed(1);return p>0?'+'+s:p<0?'−'+s:'0'}
function pc(p){return p>0?'pos':p<0?'neg':''}
function fmtRaw(n){return Number(n).toLocaleString('ja-JP')}
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(s){const [y,m,d]=s.split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,d).getDay()];return `${m}月${d}日（${w}）`}
function mname(id){const m=members.find(x=>x.id===id);return m?m.userName:'（削除済み）'}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}
/* ---- 計算 ---- */
/* 五捨六入で1,000点単位に。マイナスは絶対値で丸める（-1,500 → -1,000、-1,600 → -2,000） */
function round56(raw){const a=Math.abs(raw),th=Math.floor(a/1000)*1000,r=(a-th)>=600?th+1000:th;return raw<0?-r:r}
/* raws は東南西(北)の席順、rs は RULESETS[3|4]。同点は上家優先（席順が前の人が上位）。
   2位以下 = 丸めた素点/1000 − 返し点/1000 + ウマ、1位 = −(2位以下の合計)。1位にはオカと丸めの端数が含まれる */
function calc(raws,rs){
  const n=raws.length,idx=[...Array(n).keys()].sort((a,b)=>raws[b]-raws[a]||a-b);
  const res=Array(n);
  idx.forEach((s,k)=>{res[s]={rank:k+1,point:(round56(raws[s])-rs.ret)/1000+rs.uma[k]}});
  let others=0;for(let k=1;k<n;k++)others+=res[idx[k]].point;
  res[idx[0]].point=-others;
  return res}

/* ---- タブ ---- */
function showTab(t){document.querySelectorAll('.tab').forEach(s=>s.hidden=s.id!=='tab-'+t);
  document.querySelectorAll('.tabbar button').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  store.set('mj.tab',t);window.scrollTo(0,0);
  if(t==='stats'&&typeof drawTrend==='function')drawTrend()}
document.querySelector('.tabbar').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)showTab(b.dataset.tab)});

/* ---- 入力フォーム ---- */
const seatsEl=$('#seats');
seatsEl.innerHTML=SEATS.map((w,i)=>`<div class="seat">
  <span class="wind" aria-hidden="true">${w}</span>
  <select id="p${i}" aria-label="${w}家のメンバー"></select>
  <div class="score-box"><input type="number" step="any" id="s${i}" placeholder="25000" aria-label="${w}家の素点"></div>
  <div class="res num" id="r${i}" aria-live="polite"></div></div>`).join('');
$('#g-date').value=today();
function curRules(){return RULESETS[inputMode]}
/* 今の人数で使う席の番号（4麻: 0〜3、3麻: 0〜2） */
const act=()=>[...Array(curRules().n).keys()];
function readRaw(i){const v=$('#s'+i).value.replace(/[,，\s]/g,'').replace(/[－ー−]/g,'-');if(v===''||v==='-')return null;const n=Number(v);return Number.isFinite(n)?Math.round(n):NaN}
const lastKey=()=>'mj.lastPlayers'+(inputMode===3?'3':'');
function fillMemberSelects(){
  const last=store.get(lastKey())||[];
  for(let i=0;i<4;i++){const sel=$('#p'+i);const cur=sel.value||(editing?'':last[i]||'');
    const list=members;
    sel.innerHTML='<option value="">選択…</option>'+list.map(m=>`<option value="${esc(m.id)}">${esc(m.userName)}</option>`).join('');
    sel.value=list.some(m=>m.id===cur)?cur:''}
  exclusive(seatSels())}
/* 同じメンバーを2か所で選べないよう、ほかの欄で選ばれている人を選択肢から無効にする */
function exclusive(sels){const chosen=sels.map(s=>s.value);
  sels.forEach((s,i)=>{for(const o of s.options)o.disabled=!!o.value&&chosen.some((v,j)=>j!==i&&v===o.value)})}
const seatSels=()=>act().map(i=>$('#p'+i));
seatsEl.addEventListener('change',e=>{if(e.target.tagName==='SELECT')exclusive(seatSels())});
function updatePreview(){
  const r=curRules(),n=r.n,raws=act().map(readRaw);
  const filled=raws.filter(x=>x!=null&&!isNaN(x));const sum=filled.reduce((a,b)=>a+b,0),target=r.start*n;
  const diff=sum-target;
  $('#sum-text').innerHTML=`合計 <b>${fmtRaw(sum)}</b> / ${fmtRaw(target)}`+(filled.length===n&&diff!==0?` <span class="neg">（${diff>0?'+':''}${fmtRaw(diff)}）</span>`:filled.length===n?' <span class="pos">✓</span>':'');
  $('#fill-rest').disabled=raws.filter(x=>x==null).length!==1;
  const ok=filled.length===n&&raws.every(x=>x!=null&&!isNaN(x));
  const res=ok?calc(raws,r):null;
  for(let i=0;i<4;i++){const el=$('#r'+i);
    if(res&&i<n){el.innerHTML=`<b class="${pc(res[i].point)}">${fmtPt(res[i].point)}</b><span>${res[i].rank}位</span>`}else el.innerHTML=''}
  $('#rule-summary').textContent='ルール（'+n+'人麻雀）: '+r.text+'。同点のときに備えて、席は対局開始時（起家＝東）で入力してください。';
}
seatsEl.addEventListener('input',updatePreview);
$('#fill-rest').addEventListener('click',()=>{const r=curRules(),raws=act().map(readRaw);const e=raws.findIndex(x=>x==null);
  if(e<0||raws.some(x=>x!=null&&isNaN(x)))return;const sum=raws.reduce((a,b)=>a+(b||0),0);$('#s'+e).value=String(r.start*r.n-sum);updatePreview()});
/* 人数の切り替え: 3麻では北家の行を隠す。編集中は切り替えられない */
function applyInputMode(){const r=curRules();
  seatsEl.children[3].hidden=r.n===3;
  for(let i=0;i<4;i++)$('#s'+i).placeholder=String(r.start);
  syncModeSegs();fillMemberSelects();updatePreview();renderToday()}
function syncModeSegs(){document.querySelectorAll('.mode-seg').forEach(seg=>{const f=seg.dataset.modeFor;
  const m=f==='input'?inputMode:f==='sheet'?(sheet?sheet.mode:4):viewMode;
  const lock=(f==='input'&&!!editing)||(f==='sheet'&&!!sheetEdit);
  seg.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',String(+b.dataset.m===m));b.disabled=lock&&+b.dataset.m!==m})})}
document.addEventListener('click',e=>{const b=e.target.closest('.mode-seg button');if(!b||b.disabled)return;const m=asMode(+b.dataset.m),f=b.closest('.mode-seg').dataset.modeFor;
  if(f==='input'){if(m===inputMode)return;inputMode=m;store.set('mj.inputMode',m);formMsg('');applyInputMode()}
  else if(f==='sheet'){if(m===sheet.mode)return;sheet.mode=m;saveDraft();sheetMsg('');renderSheet()}
  else{if(m===viewMode)return;viewMode=m;store.set('mj.viewMode',m);syncModeSegs();renderHistory();renderStats()}});
function formMsg(t){const el=$('#form-msg');el.textContent=t||'';el.hidden=!t}
function resetForm(){editing=null;for(let i=0;i<4;i++)$('#s'+i).value='';$('#input-title').textContent='半荘の結果を入力';
  $('#save-game').textContent='この半荘を保存';$('#cancel-edit').hidden=true;formMsg('');syncModeSegs();fillMemberSelects();updatePreview()}
$('#cancel-edit').addEventListener('click',()=>{for(let i=0;i<4;i++)$('#p'+i).value='';resetForm()});
function startEdit(id){const g=games.find(x=>x.id===id);if(!g)return;
  if(g.manual){sheetStartEdit(g);return}
  editing=g;showTab('input');
  if(g.mode!==inputMode){inputMode=g.mode;store.set('mj.inputMode',g.mode)}
  for(let i=0;i<4;i++){$('#p'+i).value='';$('#s'+i).value=''}applyInputMode();
  $('#g-date').value=g.date;const ps=[...g.players].sort((a,b)=>a.seat-b.seat);
  ps.forEach((p,i)=>{$('#p'+i).value=p.memberId;$('#s'+i).value=String(p.raw)});exclusive(seatSels());
  $('#input-title').textContent=`対局 #${g.gameId} を編集`;$('#save-game').textContent='変更を保存';$('#cancel-edit').hidden=false;formMsg('');updatePreview()}

$('#game-form').addEventListener('submit',async e=>{e.preventDefault();
  if(!base){formMsg('データベースに接続できていないため保存できません。');return}
  if(!canWrite){formMsg('このページを編集する権限がないため保存できません。');return}
  const date=$('#g-date').value;if(!date){formMsg('対局日を選んでください。');return}
  const r=curRules(),n=r.n;
  const ids=act().map(i=>$('#p'+i).value);
  if(ids.some(x=>!x)){formMsg(`${n}人ともメンバーを選んでください。`);return}
  if(new Set(ids).size!==n){formMsg('同じメンバーが2回選ばれています。');return}
  const raws=act().map(readRaw);
  if(raws.some(x=>x==null||isNaN(x))){formMsg(`${n}人分の素点を数字で入力してください。`);return}
  const sum=raws.reduce((a,b)=>a+b,0);
  if(sum!==r.start*n){formMsg(`素点の合計が${fmtRaw(sum)}点です。${fmtRaw(r.start*n)}点になるよう直してください（供託が残った場合は1位の点数に加えます）。`);return}
  const res=calc(raws,r);
  /* 対局結果: mode=人数(3|4)、seat=開始時の席（東南西北）、rawScore=入力した素点、score=計算後のスコア */
  const results=ids.map((id,i)=>({seat:SEATS[i],userId:id,rawScore:raws[i],score:res[i].point}));
  const btn=$('#save-game');btn.disabled=true;
  try{let gameId;
    if(editing){gameId=editing.gameId;await col('games').doc(editing.id).set({gameId,mode:n,date,results})}
    else gameId=await createGame({mode:n,date,results});
    store.set(lastKey(),ids);toast(editing?`対局 #${gameId} を更新しました`:`対局 #${gameId} として保存しました`);
    const keep=ids;resetForm();keep.forEach((id,i)=>$('#p'+i).value=id);exclusive(seatSels());$('#s0').focus()}
  catch(err){handleWriteErr(err,formMsg)}
  finally{btn.disabled=false}});

/* 連番の採番: meta/counters の lastGameId / lastUserId をトランザクションで+1する。
   同時に保存されても番号は重ならない */
function nextNumber(field,makeRef,makeBody){const cRef=col('meta').doc('counters');
  return db.runTransaction(async tx=>{const c=await tx.get(cRef);const n=((c.exists&&c.data()[field])||0)+1;
    tx.set(cRef,{[field]:n},{merge:true});const [ref,body]=[makeRef(n),makeBody(n)];tx.set(ref,body);return n})}
function createGame(body){return nextNumber('lastGameId',n=>col('games').doc(String(n)),n=>({gameId:n,...body}))}
function createMember(userName){const id=n=>'U'+String(n).padStart(3,'0');
  return nextNumber('lastUserId',n=>col('members').doc(id(n)),n=>({userId:id(n),userName})).then(id)}

function handleWriteErr(err,show){const c=err&&err.code;console.warn(err);
  if(c==='permission-denied')show('保存できませんでした。Firestore のルールが公開されているか確認してください。');
  else if(c==='resource-exhausted')show('無料枠の上限に達したため、今日はこれ以上保存できません。');
  else show('保存できませんでした。通信状態を確認して、もう一度お試しください。');}

/* ---- 記録帳（列=メンバー、行=1半荘のスコアをまとめて入力） ---- */
/* sheet.cols: 列ごとのメンバーID、sheet.rows: 行ごとの入力文字列。編集中でなければ下書きとしてこの端末に保存する */
const SHEET_KEY='mj.sheetDraft';
let sheet=null, sheetEdit=null;
function blankSheet(){const d=store.get(SHEET_KEY);
  if(d&&Array.isArray(d.cols)&&Array.isArray(d.rows))return{...d,mode:asMode(d.mode)};
  return{mode:4,cols:['','','','',''],rows:Array.from({length:6},()=>Array(5).fill(''))}}
function saveDraft(){if(!sheetEdit)store.set(SHEET_KEY,sheet)}
function parseScore(v){v=String(v||'').replace(/[,，\s]/g,'').replace(/^[▲△－ー−]/,'-');
  if(v===''||v==='-')return null;const n=Number(v);return Number.isFinite(n)?Math.round(n*10)/10:NaN}
/* 1行の状態: 空行 / OK / エラー（理由つき） */
function rowState(r){const vals=sheet.rows[r].map(parseScore);const filled=vals.map((v,c)=>[v,c]).filter(([v])=>v!=null);
  if(!filled.length)return{kind:'empty'};
  if(filled.some(([v])=>isNaN(v)))return{kind:'ng',label:'数字以外',msg:'数字以外が入っています'};
  if(filled.some(([,c])=>!sheet.cols[c]))return{kind:'ng',label:'名前なし',msg:'メンバーを選んでいない列に入力があります'};
  const n=sheet.mode;
  if(filled.length!==n)return{kind:'ng',label:`${filled.length}人`,msg:`${filled.length}人分入っています（${n}人麻雀なので${n}人分）`};
  const sum=Math.round(filled.reduce((a,[v])=>a+v,0)*10)/10;
  if(sum!==0)return{kind:'ng',label:`差${sum>0?'+':''}${sum}`,msg:`合計が${sum>0?'+':''}${sum}です（0にしてください）`};
  return{kind:'ok',label:'✓',filled}}
function renderSheet(){if(!sheet)sheet=blankSheet();
  const cols=sheet.cols,edit=!!sheetEdit;
  const head=`<thead><tr><th class="rn">回</th>${cols.map((id,c)=>`<th><div class="colh"><select data-col="${c}" aria-label="${c+1}列目のメンバー"><option value="">選択…</option>${members.map(m=>`<option value="${esc(m.id)}"${m.id===id?' selected':''}>${esc(m.userName)}</option>`).join('')}</select>${!edit&&cols.length>sheet.mode?`<button type="button" class="delcol" data-delcol="${c}" aria-label="${c+1}列目を削除" title="この列を削除">✕</button>`:''}</div></th>`).join('')}<th class="st">判定</th></tr></thead>`;
  const body=`<tbody>${sheet.rows.map((row,r)=>`<tr><th class="rn">${edit?'#'+sheetEdit.gameId:r+1}</th>${cols.map((_,c)=>`<td><input type="number" step="any" autocomplete="off" data-r="${r}" data-c="${c}" value="${esc(row[c]||'')}" aria-label="${r+1}回目 ${c+1}列目のスコア"></td>`).join('')}<td class="st" data-st="${r}"></td></tr>`).join('')}</tbody>`;
  const foot=`<tfoot><tr><th class="rn">小計</th>${cols.map((_,c)=>`<td data-sub="${c}"></td>`).join('')}<td class="st"></td></tr></tfoot>`;
  $('#sheet').innerHTML=head+body+foot;
  exclusive([...document.querySelectorAll('#sheet select')]);
  $('#b-addrow').hidden=$('#b-addcol').hidden=edit;$('#b-cancel').hidden=!edit;
  $('#sheet-title').textContent=edit?`対局 #${sheetEdit.gameId} を編集（記録帳）`:'記録帳でまとめて入力';
  $('#b-save').textContent=edit?'変更を保存':'まとめて保存';
  $('#sheet-help').textContent=`列にメンバー、行に1半荘ずつのスコア（計算後の値）を入れます。${sheet.mode}人麻雀なので各行は${sheet.mode}人分だけ入力し、抜け番の人は空欄にします。この方法では素点は記録されません。`;
  syncModeSegs();refreshSheetStatus()}
function refreshSheetStatus(){
  sheet.rows.forEach((_,r)=>{const s=rowState(r),el=document.querySelector(`[data-st="${r}"]`);if(!el)return;
    el.textContent=s.kind==='empty'?'':s.label;el.className='st'+(s.kind==='ok'?' ok':s.kind==='ng'?' ng':'');if(s.msg)el.title=s.msg;});
  sheet.cols.forEach((_,c)=>{const t=Math.round(sheet.rows.reduce((a,row)=>{const v=parseScore(row[c]);return a+(v!=null&&!isNaN(v)?v:0)},0)*10)/10;
    const el=document.querySelector(`[data-sub="${c}"]`);if(el){el.textContent=fmtPt(t);el.className=pc(t)}});
  document.querySelectorAll('#sheet td input').forEach(i=>{const v=parseScore(i.value);i.classList.toggle('neg',v!=null&&v<0)})}
function sheetMsg(t){const el=$('#b-msg');el.textContent=t||'';el.hidden=!t}
$('#sheet').addEventListener('input',e=>{const i=e.target;if(i.dataset.r==null)return;sheet.rows[+i.dataset.r][+i.dataset.c]=i.value;saveDraft();refreshSheetStatus()});
$('#sheet').addEventListener('change',e=>{const s=e.target;if(s.dataset.col==null)return;sheet.cols[+s.dataset.col]=s.value;saveDraft();
  exclusive([...document.querySelectorAll('#sheet select')]);refreshSheetStatus()});
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-delcol]');if(!b)return;const c=+b.dataset.delcol;
  if(sheet.rows.some(row=>(row[c]||'')!=='')){sheetMsg(`${c+1}列目にスコアが入っているので削除できません。先にスコアを消してください。`);return}
  sheet.cols.splice(c,1);sheet.rows.forEach(row=>row.splice(c,1));saveDraft();sheetMsg('');renderSheet()});
$('#b-addrow').addEventListener('click',()=>{sheet.rows.push(Array(sheet.cols.length).fill(''));saveDraft();renderSheet()});
$('#b-addcol').addEventListener('click',()=>{if(sheet.cols.length>=10){sheetMsg('列は10人分までです。');return}
  sheet.cols.push('');sheet.rows.forEach(row=>row.push(''));saveDraft();renderSheet();
  const w=$('.sheet-wrap');w.scrollLeft=w.scrollWidth});
$('#b-clear').addEventListener('click',e=>arm(e.currentTarget,'もう一度押して消す',()=>{sheet.rows=sheet.rows.map(row=>row.map(()=>''));saveDraft();sheetMsg('');renderSheet()}));
function sheetStartEdit(g){sheetEdit=g;sheet={mode:g.mode,cols:g.players.map(p=>p.memberId),rows:[g.players.map(p=>String(p.point))]};
  $('#b-date').value=g.date;sheetMsg('');showTab('sheet');renderSheet()}
function sheetEndEdit(){sheetEdit=null;sheet=blankSheet();$('#b-date').value=today();sheetMsg('');renderSheet()}
$('#b-cancel').addEventListener('click',sheetEndEdit);
$('#b-save').addEventListener('click',async()=>{
  if(!base){sheetMsg('データベースに接続できていないため保存できません。');return}
  const date=$('#b-date').value;if(!date){sheetMsg('対局日を選んでください。');return}
  const states=sheet.rows.map((_,r)=>[r,rowState(r)]).filter(([,s])=>s.kind!=='empty');
  if(!states.length){sheetMsg('スコアが入っている行がありません。');return}
  const bad=states.filter(([,s])=>s.kind==='ng');
  if(bad.length){sheetMsg('保存できません。'+bad.map(([r,s])=>`${sheetEdit?'':r+1+'回目: '}${s.msg}`).join(' / '));return}
  /* 1行=1半荘。席は不明なので seat は null、素点も無いので rawScore は null */
  const bodies=states.map(([,s])=>({mode:sheet.mode,date,results:s.filled.map(([v,c])=>({seat:null,userId:sheet.cols[c],rawScore:null,score:v}))}));
  const btn=$('#b-save');btn.disabled=true;
  try{
    if(sheetEdit){await col('games').doc(sheetEdit.id).set({gameId:sheetEdit.gameId,...bodies[0]});toast(`対局 #${sheetEdit.gameId} を更新しました`);sheetEndEdit();return}
    const ids=[];for(const b of bodies)ids.push(await createGame(b));
    states.forEach(([r])=>sheet.rows[r]=sheet.rows[r].map(()=>''));saveDraft();renderSheet();sheetMsg('');
    toast(ids.length===1?`対局 #${ids[0]} として保存しました`:`${ids.length}半荘を保存しました（#${ids[0]}〜#${ids[ids.length-1]}）`)}
  catch(err){handleWriteErr(err,sheetMsg)}
  finally{btn.disabled=false}});
$('#b-date').value=today();

/* ---- 集計 ---- */
/* 素点の無い対局（記録帳で入力したもの）は、最高素点と飛び率の計算から除く */
function aggregate(list){const by={};
  for(const g of list)for(const p of g.players){const s=by[p.memberId]||(by[p.memberId]={id:p.memberId,games:0,total:0,ranks:[0,0,0,0],rankSum:0,busts:0,rawGames:0,best:-Infinity});
    s.games++;s.total+=p.point;s.ranks[p.rank-1]++;s.rankSum+=p.rank;
    if(p.raw!=null){s.rawGames++;if(p.raw<0)s.busts++;if(p.raw>s.best)s.best=p.raw}}
  return Object.values(by).map(s=>({...s,total:Math.round(s.total*10)/10})).sort((a,b)=>b.total-a.total)}
function pct(n,d){return d?(n/d*100).toFixed(1)+'%':'—'}

function gameHtml(g,no){const ps=[...g.players].sort((a,b)=>a.rank-b.rank||a.seat-b.seat);
  return `<div class="game"><div class="game-head"><span>第${no}半荘</span><span class="num">対局 #${g.gameId}</span>${g.manual?'<span>記録帳</span>':''}${canWrite&&db?`<span class="acts"><button class="btn sm" data-edit="${esc(g.id)}">編集</button><button class="btn sm" data-del="${esc(g.id)}">削除</button></span>`:''}</div>
  <table><tbody>${ps.map(p=>`<tr><td class="c-rk"><span class="rk ${rkClass(p.rank,g.mode)}">${p.rank}</span></td><td class="nm">${esc(mname(p.memberId))} <span class="small muted">${p.seatKnown?SEATS[p.seat]:''}</span></td><td class="r c-raw">${p.raw==null?'<span class="muted">—</span>':fmtRaw(p.raw)}</td><td class="r c-pt ${pc(p.point)}"><b>${fmtPt(p.point)}</b></td></tr>`).join('')}</tbody></table></div>`}
function dayTotalsHtml(list){const agg=aggregate(list);
  return `<table><thead><tr><th>メンバー</th><th class="r c-n">半荘</th><th class="r c-avg">平均順位</th><th class="r c-tot">合計</th></tr></thead><tbody>${agg.map(s=>`<tr><td class="nm">${esc(mname(s.id))}</td><td class="r">${s.games}</td><td class="r">${(s.rankSum/s.games).toFixed(2)}</td><td class="r ${pc(s.total)}"><b>${fmtPt(s.total)}</b></td></tr>`).join('')}</tbody></table>`}

/* 今日の成績は、入力画面で選んでいる人数（4麻/3麻）の対局だけ */
function renderToday(){const t=today();const list=games.filter(g=>g.date===t&&g.mode===inputMode).sort((a,b)=>a.gameId-b.gameId);
  $('#today-box').innerHTML=list.length?`<div class="card stack">${dayTotalsHtml(list)}${list.map((g,i)=>gameHtml(g,i+1)).reverse().join('')}</div>`
    :`<div class="empty">今日の${inputMode}人麻雀はまだ記録がありません。上のフォームから1半荘目を保存すると、ここに今日の合計が出ます。</div>`}

/* 履歴・成績は viewMode（4麻/3麻）の対局だけを対象にする */
const viewGames=()=>games.filter(g=>g.mode===viewMode);
function renderHistory(){const games=viewGames();
  const months=[...new Set(games.map(g=>g.date.slice(0,7)))].sort().reverse();
  const sel=$('#h-month');const cur=sel.value;
  sel.innerHTML='<option value="">すべての月</option>'+months.map(m=>{const [y,mo]=m.split('-');return `<option value="${m}">${y}年${Number(mo)}月</option>`}).join('');
  sel.value=months.includes(cur)?cur:'';
  const list=games.filter(g=>!sel.value||g.date.startsWith(sel.value));
  if(!list.length){$('#history').innerHTML=`<div class="empty">${viewMode}人麻雀の対局記録はまだありません。「入力」タブで半荘の結果を保存すると、日付ごとにここへまとまります。</div>`;return}
  const byDate={};for(const g of list)(byDate[g.date]||(byDate[g.date]=[])).push(g);
  const dates=Object.keys(byDate).sort().reverse();const openSet=new Set([...document.querySelectorAll('details.day[open]')].map(d=>d.dataset.date));
  const first=!document.querySelector('details.day');
  $('#history').innerHTML=dates.map((d,di)=>{const gs=byDate[d].sort((a,b)=>a.gameId-b.gameId);
    const agg=aggregate(gs);const top=agg[0];const open=openSet.has(d)||(first&&di===0);
    return `<details class="day" data-date="${d}"${open?' open':''}><summary><span class="d">${fmtDate(d)}</span><span class="small muted">${d.slice(0,4)}年・${gs.length}半荘・${agg.length}人</span><span class="chev" aria-hidden="true">›</span></summary>
    <div class="day-body"><div class="small muted">この日のトップ: <b style="color:var(--ink)">${esc(mname(top.id))}</b> <span class="${pc(top.total)}">${fmtPt(top.total)}</span></div>${dayTotalsHtml(gs)}${gs.map((g,i)=>gameHtml(g,i+1)).join('')}</div></details>`}).join('')}
$('#h-month').addEventListener('change',renderHistory);

function inPeriod(g){const t=today();
  if(period==='year')return g.date.slice(0,4)===t.slice(0,4);
  if(period==='month')return g.date.slice(0,7)===t.slice(0,7);
  if(period==='custom'){const f=$('#s-from').value,to=$('#s-to').value;return(!f||g.date>=f)&&(!to||g.date<=to)}
  return true}
function renderStats(){const n=viewMode,all=viewGames(),list=all.filter(inPeriod);const agg=aggregate(list);
  /* 順位の色見本: 最下位は赤（3麻なら 1位・2位・3位(赤)） */
  $('#rank-legend').innerHTML=[...Array(n).keys()].map(k=>`<span><i style="background:var(--r${k+1===n?4:k+1})"></i>${k+1}位</span>`).join('');
  renderTrend(list);
  if(!agg.length){$('#stats').innerHTML=`<div class="empty">${all.length?'この期間の対局はありません。':`${n}人麻雀の対局記録はまだありません。半荘を保存すると、メンバーごとの合計ポイント・平均順位・トップ率がここに並びます。`}</div>`;return}
  const days=new Set(list.map(g=>g.date)).size;
  $('#stats').innerHTML=`<div class="small muted">${n}人麻雀・${days}日・${list.length}半荘を集計</div>`+agg.map((s,i)=>`<div class="card pcard">
    <span class="pos-no">${i+1}</span><span class="name">${esc(mname(s.id))}</span><span class="total num ${pc(s.total)}">${fmtPt(s.total)}</span>
    <div class="dist" role="img" aria-label="${s.ranks.slice(0,n).map((c,k)=>`${k+1}位${c}回`).join('、')}">${s.ranks.slice(0,n).map((c,k)=>c?`<i style="flex:${c} 1 0;background:var(--r${k+1===n?4:k+1})"></i>`:'').join('')}</div>
    <div class="meta num"><div>半荘<b>${s.games}</b></div><div>平均順位<b>${(s.rankSum/s.games).toFixed(2)}</b></div><div>平均pt<b class="${pc(s.total)}">${fmtPt(Math.round(s.total/s.games*10)/10)}</b></div><div>最高素点<b>${s.rawGames?fmtRaw(s.best):'—'}</b></div>
    <div>トップ率<b>${pct(s.ranks[0],s.games)}</b></div><div>連対率<b>${pct(s.ranks[0]+s.ranks[1],s.games)}</b></div><div>ラス率<b>${pct(s.ranks[n-1],s.games)}</b></div><div>飛び率<b>${pct(s.busts,s.rawGames)}</b></div></div></div>`).join('')}
/* ---- 累積スコアの推移グラフ ----
   横軸 = 期間内で対局のあった日（左端は 0 から始める「開始」）、縦軸 = その日までの累積スコア。
   線の色はメンバーに固定（U001 から順に8色、9人目以降は灰色）なので、期間や表示を変えても色は変わらない */
const hiddenSeries=new Set();let trendData=null,trendGeom=null;
function seriesColor(id){const i=members.findIndex(m=>m.id===id);return i>=0&&i<8?`var(--s${i+1})`:'var(--s-other)'}
function niceStep(range){for(const c of [5,10,20,25,50,100,200,250,500,1000,2000,5000])if(range/c<=5)return c;return 10000}
function pickTicks(n,max){max=Math.max(2,Math.floor(max));if(n+1<=max)return[...Array(n+1).keys()];
  const k=max-1;return[...new Set(Array.from({length:k+1},(_,j)=>Math.round(j*n/k)))]}
function shortDate(d,withYear){const [y,m,dd]=d.split('-');return (withYear?y.slice(2)+'/':'')+Number(m)+'/'+Number(dd)}
function renderTrend(list){const box=$('#trend');
  if(!list.length){box.hidden=true;trendData=null;return}box.hidden=false;
  const dates=[...new Set(list.map(g=>g.date))].sort();
  const order=id=>{const i=members.findIndex(m=>m.id===id);return i<0?999:i};
  const ids=[...new Set(list.flatMap(g=>g.players.map(p=>p.memberId)))].sort((a,b)=>order(a)-order(b));
  const day={};list.forEach(g=>g.players.forEach(p=>{const d=day[g.date]||(day[g.date]={});d[p.memberId]=(d[p.memberId]||0)+p.point}));
  const per={};ids.forEach(id=>{let acc=0;per[id]=[0].concat(dates.map(d=>acc=Math.round((acc+((day[d]||{})[id]||0))*10)/10))});
  trendData={dates,ids,per,withYear:dates[0].slice(0,4)!==dates[dates.length-1].slice(0,4)};
  drawTrend();renderLegend()}
function drawTrend(){const svg=$('#chart');hideTip();if(!trendData||!svg.clientWidth)return;
  const {dates,ids,per,withYear}=trendData,vis=ids.filter(id=>!hiddenSeries.has(id));
  const W=svg.clientWidth,H=240,direct=vis.length>0&&vis.length<=4,L=44,R=direct?64:12,T=10,B=26,n=dates.length;
  const vals=vis.flatMap(id=>per[id]).concat([0]);let lo=Math.min(...vals),hi=Math.max(...vals);
  const step=niceStep(hi-lo||10);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(lo===hi)hi=lo+step;
  const x=i=>L+(W-L-R)*(i/n),y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let s='';
  for(let v=lo;v<=hi+1e-9;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v===0?'--axis':'--grid'})" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtPt(v)}</text>`;
  const lab=i=>i===0?'開始':shortDate(dates[i-1],withYear);
  s+=pickTicks(n,(W-L-R)/58).map(i=>`<text x="${x(i)}" y="${H-7}" text-anchor="${i===0?'start':i===n?'end':'middle'}">${lab(i)}</text>`).join('');
  vis.forEach(id=>{s+=`<polyline points="${per[id].map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="${seriesColor(id)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
  if(direct){const ends=vis.map(id=>({id,y:y(per[id][n])})).sort((a,b)=>a.y-b.y);
    for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<13)ends[k].y=ends[k-1].y+13;
    ends.forEach(e=>{const nm=mname(e.id);s+=`<text x="${W-R+6}" y="${e.y+4}" style="fill:var(--ink)">${esc(nm.length>5?nm.slice(0,5)+'…':nm)}</text>`})}
  s+=`<g id="cross"></g>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=s;trendGeom={x,y,n,L,R,W,vis}}
function renderLegend(){const {ids}=trendData;
  $('#chart-legend').innerHTML=ids.map(id=>`<button type="button" data-series="${esc(id)}" aria-pressed="${!hiddenSeries.has(id)}"><i class="sw" style="background:${seriesColor(id)}"></i><span class="n">${esc(mname(id))}</span></button>`).join('')}
$('#chart-legend').addEventListener('click',e=>{const b=e.target.closest('[data-series]');if(!b)return;const id=b.dataset.series;
  hiddenSeries.has(id)?hiddenSeries.delete(id):hiddenSeries.add(id);drawTrend();renderLegend()});
/* タップ（マウスなら重ねる）で、いちばん近い日の縦線と各メンバーの累積値を表示 */
function showTipAt(px){if(!trendGeom||!trendGeom.vis.length)return;const {x,y,n,L,R,W,vis}=trendGeom;
  const i=Math.max(0,Math.min(n,Math.round((px-L)/(W-L-R)*n)));const {dates,per,withYear}=trendData;
  $('#cross').innerHTML=`<line x1="${x(i)}" x2="${x(i)}" y1="10" y2="214" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`+
    vis.map(id=>`<circle cx="${x(i)}" cy="${y(per[id][i])}" r="4.5" fill="${seriesColor(id)}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const rows=[...vis].sort((a,b)=>per[b][i]-per[a][i]);
  const tip=$('#chart-tip');tip.innerHTML=`<div class="muted" style="margin-bottom:2px">${i===0?'開始時点':fmtDate(dates[i-1])+(withYear?' '+dates[i-1].slice(0,4)+'年':'')+'まで'}</div>`+
    rows.map(id=>`<div class="tr"><span><i class="sw" style="background:${seriesColor(id)}"></i>${esc(mname(id))}</span><b class="num">${fmtPt(per[id][i])}</b></div>`).join('');
  tip.hidden=false;const bw=$('#chart-box').clientWidth,tw=tip.offsetWidth,cx=x(i)*bw/W;
  tip.style.left=Math.max(0,Math.min(bw-tw,cx>bw/2?cx-tw-10:cx+10))+'px'}
function hideTip(){const t=$('#chart-tip');if(t)t.hidden=true;const c=$('#cross');if(c)c.innerHTML=''}
function chartX(e){const r=$('#chart').getBoundingClientRect();return (e.clientX-r.left)*(trendGeom?trendGeom.W:r.width)/r.width}
$('#chart').addEventListener('pointerdown',e=>showTipAt(chartX(e)));
$('#chart').addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)showTipAt(chartX(e))});
$('#chart').addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#chart-box'))hideTip()});
let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(drawTrend,150)});

$('#period').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;period=b.dataset.p;
  document.querySelectorAll('#period button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#custom-range').hidden=period!=='custom';renderStats()});
$('#s-from').addEventListener('change',renderStats);$('#s-to').addEventListener('change',renderStats);

/* 2回タップで確定するボタン */
function arm(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed='1';const old=btn.textContent;btn.textContent=label;btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('armed')}},3000)}
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){startEdit(ed.dataset.edit);return}
  const del=e.target.closest('[data-del]');if(del){arm(del,'もう一度押して削除',async()=>{try{await col('games').doc(del.dataset.del).delete();toast('削除しました')}catch(err){handleWriteErr(err,toast)}});}
});

/* ---- メンバー ---- */
function renderMembers(){const cnt={};for(const g of games)for(const p of g.players)cnt[p.memberId]=(cnt[p.memberId]||0)+1;
  const el=$('#members');
  if(!members.length){el.innerHTML='<div class="muted small">まだメンバーがいません。上の欄に名前を入れて「追加」を押してください。入力画面で4人を選べるようになります。</div>';return}
  const focused=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.rename;
  if(focused)return;
  el.innerHTML=members.map(m=>`<div class="mrow">
    <span class="uid num">${esc(m.userId)}</span>
    <input type="text" value="${esc(m.userName)}" data-rename="${esc(m.id)}" maxlength="20" aria-label="${esc(m.userId)}のユーザー名" ${canWrite&&db?'':'readonly'}>
    <span class="small muted num">${cnt[m.id]||0}半荘</span>
    <span class="row" style="flex-wrap:nowrap">${canWrite&&db&&!cnt[m.id]?`<button class="btn sm" data-mdel="${esc(m.id)}">削除</button>`:''}</span></div>`).join('')}
/* ユーザーIDは U001 から連番で自動採番（ドキュメントIDと同じ値） */
$('#member-form').addEventListener('submit',async e=>{e.preventDefault();const inp=$('#m-name');const userName=inp.value.trim();if(!userName)return;
  if(!db){toast('データベースに接続できていません');return}
  if(members.some(m=>m.userName===userName)){toast('同じユーザー名がすでに登録されています');return}
  try{const userId=await createMember(userName);inp.value='';toast(`${userName}さんを ${userId} で登録しました`)}catch(err){handleWriteErr(err,toast)}});
$('#members').addEventListener('change',async e=>{const id=e.target.dataset.rename;if(!id)return;const userName=e.target.value.trim();const m=members.find(x=>x.id===id);
  if(!m||!userName||userName===m.userName){e.target.value=m?m.userName:'';return}
  if(members.some(x=>x.id!==id&&x.userName===userName)){toast('同じユーザー名がすでに登録されています');e.target.value=m.userName;return}
  try{await col('members').doc(id).update({userName});toast('ユーザー名を変更しました')}catch(err){handleWriteErr(err,toast)}});
$('#members').addEventListener('click',async e=>{
  const d=e.target.closest('[data-mdel]');if(d)arm(d,'本当に削除',async()=>{try{await col('members').doc(d.dataset.mdel).delete();toast('削除しました')}catch(err){handleWriteErr(err,toast)}})});

/* ---- 全体 ---- */
function applyWriteMode(){const ro=!base;$('#save-game').disabled=ro;$('#member-form').hidden=ro}
/* DBの対局結果を画面用に変換。順位は保存せず、スコアの高い順に付ける。
   席が分かる対局は同点なら上家優先、記録帳の対局（席なし）は同点を同順位にする */
function toGame(id,x){const mode=asMode(x&&x.mode);/* mode の無い古い対局は4麻 */
  if(!x||!x.gameId||!x.date||!Array.isArray(x.results)||x.results.length!==mode)return null;
  const players=x.results.map((r,i)=>{const si=SEATS.indexOf(r.seat);
    return{seat:si<0?i:si,seatKnown:si>=0,memberId:r.userId,raw:r.rawScore==null?null:Number(r.rawScore),point:Number(r.score)}});
  const manual=players.some(p=>p.raw==null);
  if(players.every(p=>p.seatKnown))[...players].sort((a,b)=>b.point-a.point||a.seat-b.seat).forEach((p,k)=>p.rank=k+1);
  else players.forEach(p=>p.rank=1+players.filter(q=>q.point>p.point).length);
  return{id,gameId:Number(x.gameId),mode,date:x.date,players,manual}}
function renderAll(){fillMemberSelects();updatePreview();renderToday();renderHistory();renderStats();renderMembers();
  /* 記録帳に入力中なら、打っている途中のマスを消さないよう作り直さない */
  if(!$('#sheet').contains(document.activeElement))renderSheet()}

/* ---- 接続 ---- */
const lastTab=store.get('mj.tab');if(lastTab&&document.getElementById('tab-'+lastTab))showTab(lastTab);
sheet=blankSheet();applyInputMode();renderAll();applyWriteMode();
(function init(){
  if(!window.firebase||!FIREBASE_CONFIG.projectId){
    const b=$('#global-banner');b.textContent=window.firebase?'Firebase の設定がまだです。index.html の FIREBASE_CONFIG を書き換えてください。':'データベースのプログラムを読み込めませんでした。通信状態を確認して再読み込みしてください。';b.hidden=false;
    $('#status').textContent='未設定';return}
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();base=db;
  applyWriteMode();$('#status').textContent='接続中…';
  let loaded=0,m1=false,m3=false;
  const ok=()=>{if(++loaded===2)$('#status').textContent='同期済み'};
  const err=e=>{console.warn(e);$('#status').textContent='接続エラー';
    if(e&&e.code==='permission-denied'){const b=$('#global-banner');b.textContent='データベースに読み書きできません。Firestore のルールが公開されているか確認してください。';b.hidden=false}};
  col('members').onSnapshot(s=>{members=s.docs.map(d=>{const x=d.data();return{id:d.id,userId:x.userId||d.id,userName:String(x.userName||'')}}).sort((a,b)=>a.userId.localeCompare(b.userId));if(!m1){m1=true;ok()}renderAll()},err);
  col('games').onSnapshot(s=>{games=s.docs.map(d=>toGame(d.id,d.data())).filter(Boolean);if(!m3){m3=true;ok()}renderAll()},err);
})();
